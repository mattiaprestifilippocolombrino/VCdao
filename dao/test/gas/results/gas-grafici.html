<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Misurazioni gas V3</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #17202a; }
    h1, h2 { margin: 0 0 16px; }
    section { margin-bottom: 42px; }
    .chart { width: 100%; max-width: 1040px; border: 1px solid #d6dde5; border-radius: 8px; padding: 16px; }
    .bar-label { font-size: 12px; fill: #26323f; }
    .axis { stroke: #9aa8b5; stroke-width: 1; }
  </style>
</head>
<body>
  <h1>Misurazioni gas V3 Topic-Based DAO</h1>
  <section>
  <h2>Gas per fase del flow principale</h2>
  <div class="chart">
    <svg viewBox="0 0 1040 374" role="img" aria-label="Gas per fase del flow principale">
      <line class="axis" x1="230" y1="28" x2="1016" y2="28"></line>
      
      <text class="bar-label" x="0" y="55">Join DAO</text>
      <rect x="230" y="42" width="252.56235569252723" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="488.56235569252726" y="55">1.499.225 gas</text>
      <text class="bar-label" x="0" y="93">Delegate</text>
      <rect x="230" y="80" width="161.08634170027648" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="397.0863417002765" y="93">956.218 gas</text>
      <text class="bar-label" x="0" y="131">Register DID</text>
      <rect x="230" y="118" width="125.73359230228019" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="361.73359230228016" y="131">746.362 gas</text>
      <text class="bar-label" x="0" y="169">Upgrade skill with VC</text>
      <rect x="230" y="156" width="680" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="916" y="169">4.036.520 gas</text>
      <text class="bar-label" x="0" y="207">Propose with topic</text>
      <rect x="230" y="194" width="16.271739022722542" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="252.27173902272256" y="207">96.590 gas</text>
      <text class="bar-label" x="0" y="245">Cast vote</text>
      <rect x="230" y="232" width="194.74773319592123" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="430.7477331959212" y="245">1.156.034 gas</text>
      <text class="bar-label" x="0" y="283">Queue</text>
      <rect x="230" y="270" width="29.422383637390624" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="265.4223836373906" y="283">174.653 gas</text>
      <text class="bar-label" x="0" y="321">Execute</text>
      <rect x="230" y="308" width="36.64299941533796" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="272.64299941533795" y="321">217.515 gas</text>
    </svg>
  </div>
</section>
  <section>
  <h2>Costi aggregati</h2>
  <div class="chart">
    <svg viewBox="0 0 1040 184" role="img" aria-label="Costi aggregati">
      <line class="axis" x1="230" y1="28" x2="1016" y2="28"></line>
      
      <text class="bar-label" x="0" y="55">10 Member Activation Cost</text>
      <rect x="230" y="42" width="554.0916549900221" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="790.0916549900221" y="55">7.238.325 gas</text>
      <text class="bar-label" x="0" y="93">Governance Cycle Cost</text>
      <rect x="230" y="80" width="125.90834500997792" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="361.9083450099779" y="93">1.644.792 gas</text>
      <text class="bar-label" x="0" y="131">Total Gas</text>
      <rect x="230" y="118" width="680" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="916" y="131">8.883.117 gas</text>
    </svg>
  </div>
</section>
  <section>
  <h2>Scalabilita upgradeSkillWithVC</h2>
  <div class="chart">
    <svg viewBox="0 0 1040 260" role="img" aria-label="Scalabilita upgradeSkillWithVC">
      <line class="axis" x1="230" y1="28" x2="1016" y2="28"></line>
      
      <text class="bar-label" x="0" y="55">1 skill</text>
      <rect x="230" y="42" width="642.9729542984805" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="878.9729542984805" y="55">451.593 gas</text>
      <text class="bar-label" x="0" y="93">2 skill</text>
      <rect x="230" y="80" width="648.178325331502" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="884.178325331502" y="93">455.249 gas</text>
      <text class="bar-label" x="0" y="131">4 skill</text>
      <rect x="230" y="118" width="658.799788106759" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="894.799788106759" y="131">462.709 gas</text>
      <text class="bar-label" x="0" y="169">6 skill</text>
      <rect x="230" y="156" width="668.4075134160666" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="904.4075134160666" y="169">469.457 gas</text>
      <text class="bar-label" x="0" y="207">8 skill</text>
      <rect x="230" y="194" width="680" height="16" fill="#2f80ed"></rect>
      <text class="bar-label" x="916" y="207">477.599 gas</text>
    </svg>
  </div>
</section>
</body>
</html>
